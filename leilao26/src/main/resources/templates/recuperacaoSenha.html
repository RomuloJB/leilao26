<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Recuperação de Senha</title>
</head>
<body style="margin: 0; padding: 24px; background: #f3f7f3; font-family: Arial, Helvetica, sans-serif; color: #123b15;">
  <div style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 10px; padding: 32px;">
    <h2 style="margin-top: 0;">Olá, <span th:text="${nome}">usuário</span>!</h2>

    <p>Recebemos uma solicitação para redefinir a senha da sua conta.</p>
    <p>Use o código abaixo na tela de alteração de senha:</p>

    <p style="font-size: 28px; font-weight: bold; letter-spacing: 6px; text-align: center; background: #eef6ef; border-radius: 6px; padding: 14px;"
       th:text="${codigo}">000000</p>

    <p>O código é válido por <strong th:text="${validadeMinutos}">15</strong> minutos.</p>

    <p style="color: #5b825f; font-size: 13px;">
      Se você não solicitou a recuperação de senha, ignore este e-mail. Sua senha continuará a mesma.
    </p>
  </div>
</body>
</html>
